version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db_hu8
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password
      POSTGRES_DB: umsspula_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_hu8:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_cache_hu8
    ports:
      - "6379:6379"

volumes:
  pgdata_hu8: